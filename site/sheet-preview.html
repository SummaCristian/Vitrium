<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sheet preview</title>
</head>
<body class="preview sheet-preview">
  <main id="screen">
    <h1>Behind the sheet</h1>
    <p>Whether this page stays usable depends on the sheet's background interaction.</p>
    <div class="row">
      <button class="lg-btn pill lg-glass liquid-glass" id="tap" type="button">Taps: 0</button>
      <button class="lg-btn pill lg-glass liquid-glass" id="open" type="button">Open sheet</button>
    </div>
  </main>
  <script type="module" src="./sheet-preview.js"></script>
</body>
</html>
